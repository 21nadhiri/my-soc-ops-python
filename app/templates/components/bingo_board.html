<div class="grid grid-cols-5 gap-1 w-full max-w-md mx-auto aspect-square glass rounded-2xl p-4 shadow-glass animate-fade-in-up animate-stagger-2">
    {% for square in session.board %}
    {% set is_winning = square.id in session.winning_square_ids %}
    <button
        {% if not square.is_free_space %}
        hx-post="/toggle/{{ square.id }}"
        hx-target="#game-container"
        hx-swap="outerHTML"
        {% endif %}
        {% if square.is_free_space %}disabled{% endif %}
        class="relative flex items-center justify-center p-1 text-center border rounded-lg transition-all duration-300 select-none min-h-[60px] text-xs leading-tight
        {%- if square.is_marked %}
            {%- if is_winning %} metallic border-accent text-dark shadow-glass animate-glass-glow
            {%- else %} bg-success border-success text-light shadow-sm
            {%- endif %}
        {%- else %} glass border-glass text-light hover:bg-glass hover:shadow-sm active:shadow-inner
        {%- endif %}
        {%- if square.is_free_space %} metallic font-bold text-sm text-dark{% endif %}"
        aria-pressed="{{ 'true' if square.is_marked else 'false' }}"
        aria-label="{{ 'Free space' if square.is_free_space else square.text }}">
        <span class="wrap-break-word hyphens-auto">{{ square.text }}</span>
        {% if square.is_marked and not square.is_free_space %}
        <span class="absolute top-0.5 right-0.5 text-success text-xs">✓</span>
        {% endif %}
    </button>
    {% endfor %}
</div>
