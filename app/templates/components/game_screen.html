<div id="game-container" class="flex flex-col min-h-full">
    <!-- Header -->
    <header class="flex items-center justify-between p-3 glass rounded-b-2xl border-b border-glass animate-fade-in-up">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="text-light text-sm px-3 py-1.5 rounded chrome-btn active:shadow-glass transition-all duration-300">
            ← Back
        </button>
        <h1 class="font-bold text-light">Soc Ops</h1>
        <div class="w-16"></div>
    </header>

    <!-- Instructions -->
    <p class="text-center text-accent text-sm py-2 px-4 animate-fade-in-up animate-stagger-1">
        Tap a square when you find someone who matches it.
    </p>

    <!-- Bingo indicator -->
    {% if session.has_bingo %}
    <div class="glass text-warning text-center py-2 font-semibold text-sm rounded-lg mx-4 mb-2 animate-glass-glow shadow-glass">
        🎉 BINGO! You got a line!
    </div>
    {% endif %}

    <!-- Board -->
    <div class="flex-1 flex items-center justify-center p-3">
        {% include "components/bingo_board.html" %}
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
